[workspace]
resolver = "3"
members = [
    "crates/*", "examples/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kazanefu/clione"

[workspace.dependencies]
clione_core = { path = "crates/clione_core" }
clione_render = { path = "crates/clione_render" }
clione_input = { path = "crates/clione_input" }
clione_terminal = { path = "crates/clione_terminal" }
